name: Deploy WIV Site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Inspect build output
        run: |
          echo "Searching for generated index.html files..."
          find . -path ./node_modules -prune -o -name "index.html" -print

          echo "Checking build directories..."
          if [ -d "dist" ]; then
            echo "Contents of dist:"
            ls -la dist
          fi

          if [ -d ".output/public" ]; then
            echo "Contents of .output/public:"
            ls -la .output/public
          fi

      - name: Prepare website for GitHub Pages
        run: |
          mkdir -p _site

          if [ -f "dist/index.html" ]; then
            echo "Using dist as website directory"
            cp -r dist/. _site/
          elif [ -f ".output/public/index.html" ]; then
            echo "Using .output/public as website directory"
            cp -r .output/public/. _site/
          else
            echo "ERROR: No static index.html was generated."
            echo "This project may require additional configuration for static hosting."
            exit 1
          fi

          echo "Final website files:"
          ls -la _site

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
