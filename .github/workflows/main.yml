name: Deploy WIV Site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Check build files
        run: |
          echo "=== PROJECT ROOT ==="
          ls -la

          echo "=== .OUTPUT CONTENTS ==="
          find .output -maxdepth 3 -type f | sort || true

          echo "=== PUBLIC BUILD FOLDER ==="
          ls -la .output/public || true

          echo "=== CHECKING FOR INDEX.HTML ==="
          find .output/public -name "index.html" -type f || true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
